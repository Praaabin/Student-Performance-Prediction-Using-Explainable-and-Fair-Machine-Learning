[pytest]
# ── pytest.ini ──────────────────────────────────────────────────────────────
# Configuration for the XAI Student Performance Prediction test suite.
# ────────────────────────────────────────────────────────────────────────────

# Test discovery
testpaths     = tests
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# Output verbosity
addopts =
    --verbose
    --tb=short
    --strict-markers
    --color=yes
    -ra

# Custom markers
markers =
    unit:        Fast, isolated unit tests (no I/O, no real models)
    integration: Tests that combine multiple pipeline components
    data:        Tests requiring the real CSV data files to be present
    slow:        Tests that may take >5 seconds (e.g. training on full data)
    fairness:    Tests specifically validating demographic fairness metrics

# Filter known non-critical warnings
filterwarnings =
    ignore::DeprecationWarning:sklearn.*
    ignore::FutureWarning:sklearn.*
    ignore::UserWarning:matplotlib.*
    ignore::UserWarning:shap.*
